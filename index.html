<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIGHT CLUB TIMER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>FIGHT CLUB TIMER</h1>
            <p>Seu treino, seu ritmo.</p>
        </header>

        <section class="timer-card">

            <span id="phase">PRONTO PARA TREINAR</span>

            <div class="timer" id="timer">
                00:30
            </div>

            
            <div class="Exercício">
                EXERCÍCIO: <span id="currentRound">1</span>
                /
                <span id="totalRounds">5</span>
            </div>

            <label for="volume">Volume dos avisos</label>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.05"
                    value="0.85"
                >
            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <div class="buttons">
                <button id="startBtn">INICIAR</button>
                <button id="pauseBtn">PAUSAR</button>
                <button id="resetBtn">REINICIAR</button>
            </div>

        </section>

        <section class="settings">

            <h2>CONFIGURAR TREINO</h2>

            <label for="workTime">Tempo de treino (segundos)</label>
            <input type="number" id="workTime" value="30" min="1">

            <label for="restTime">Tempo de descanso (segundos)</label>
            <input type="number" id="restTime" value="15" min="0">

            <label for="rounds">Quantidade de Exercícios</label>
            <input type="number" id="rounds" value="5" min="1">

            <button id="saveBtn">SALVAR TREINO</button>

            <h2>MEUS TREINOS</h2>

            <select id="savedWorkouts">
                <option value="">Selecione um treino</option>
            </select>

            <button id="loadBtn">CARREGAR TREINO</button>

        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
